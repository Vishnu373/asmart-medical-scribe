[package]
name = "medical-scribe"
version = "0.1.0"
description = "On-device medical scribe"
edition = "2021"
default-run = "medical-scribe"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "medical_scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
# Audio capture (cpal), resampling to 16 kHz mono (rubato), WAV I/O (hound) and
# the spectrum level meter (rustfft). Ported from the reference STT toolkit (B3).
cpal = "0.16"
rubato = "0.16"
hound = "3.5"
rustfft = "6"
# Silero voice-activity detection (ONNX). Same fork the reference toolkit uses;
# the silero_vad_v4.onnx model is vendored under resources/models/ (B4).
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
# STT engines (B5): Whisper via whisper-cpp + Parakeet/ONNX, CPU-only.
transcribe-rs = { version = "0.3.8", features = ["whisper-cpp", "onnx"] }
# Transcript text cleanup (custom words + filler/stutter filtering, ported text.rs).
natural = "0.5"
once_cell = "1"
regex = "1"
strsim = "0.11"
# Encrypted clinical DB (SQLCipher). `bundled-sqlcipher` compiles SQLCipher but
# links the system OpenSSL (set OPENSSL_DIR to the install, e.g. C:\Program Files\OpenSSL).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
rusqlite_migration = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
# Scrub transient plaintext key copies from memory on drop (§10.1).
zeroize = "1"

# Windows DPAPI for wrapping the DB key (design §10.1).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"
